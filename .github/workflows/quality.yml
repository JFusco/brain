name: Quality

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - name: Enable declared pnpm via Corepack
        run: corepack enable && corepack install
      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-10-${{ hashFiles('pnpm-lock.yaml', 'web/brain/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-10-
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir web/brain install --frozen-lockfile
      - name: Install the pinned scanner profile
        run: node scripts/hosted/setup.mjs
      - name: Run complete non-fixing quality gate
        env:
          WIKI_HOME: ${{ github.workspace }}/.state/wiki-plan-scope
        run: pnpm run verify:ci
