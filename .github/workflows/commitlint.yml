name: Commit message lint

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: commitlint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - name: Enable declared pnpm via Corepack
        run: corepack enable && corepack install
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Dependabot writes its own title, body and commits; its PRs skip
      # these three lint steps and pass on the job's success (issue 302).
      - name: Lint PR title
        if: ${{ !startsWith(github.event.pull_request.head.ref, 'dependabot/') }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm run --silent lint:commit --verbose
      - name: Validate PR body
        if: ${{ !startsWith(github.event.pull_request.head.ref, 'dependabot/') }}
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: pnpm run --silent lint:pr
      - name: Lint PR commit range
        if: ${{ !startsWith(github.event.pull_request.head.ref, 'dependabot/') }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm run --silent lint:commit --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
